[project]
name = "picfinder"
version = "0.4.0"
description = "A simple windows application to search for images in a directory."
authors = [{ name = "HighDoping", email = "highdoping@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyside6>=6.10.0",
    "onnxruntime>=1.23.2",
    "rapidocr>=3.9.2",
    "imohash>=1.1.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.1",
]

[dependency-groups]
dev = [
    "black>=24.3.0",
    "notebook>=6.5.3",
    "nuitka>=2.1.5",
    "onnx>=1.17.0",
    "ultralytics>=8.4",
    "onnxslim>=0.1.71",
    "requests>=2.32.5",
    "tqdm>=4.66.0",
    "pytest>=9.0.2",
]

gpu = [
    "torch>=2.10.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torch>=2.10.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torchvision; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torchaudio>=2.10.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchaudio>=2.10.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]



[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
